<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brown GP Session Timing</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&family=Roboto+Mono:wght@400;500;700&display=swap');

:root {
    --red: #e10600;
    --bg: #080a0e;
    --surface: #0e1117;
    --surface2: #13161f;
    --surface3: #1a1d28;
    --border: #1e2230;
    --border2: #252838;
    --text: #f0f0f0;
    --text-dim: #6b7280;
    --text-mid: #9ca3af;
    --green: #00d2be;
    --yellow: #ffe600;
    --purple: #c084fc;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Titillium Web', sans-serif;
    min-height: 100vh;
}

.top-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--red); z-index: 100; }

/* HEADER */
.page-header {
    position: sticky; top: 3px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border2);
    padding: 14px 16px 12px;
    z-index: 50;
}

.header-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
}

.session-eyebrow {
    font-family: 'Roboto Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--red);
    text-transform: uppercase;
    margin-bottom: 3px;
}

#session-name {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.3px;
    line-height: 1.1;
}

.header-right {
    display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
}

.live-badge {
    display: flex; align-items: center; gap: 5px;
    background: rgba(225,6,0,0.12);
    border: 1px solid rgba(225,6,0,0.3);
    border-radius: 2px;
    padding: 3px 8px;
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    color: var(--red);
    letter-spacing: 1px;
}

.live-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--red);
    animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse { 
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
}

#session-clock {
    font-family: 'Roboto Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
}

/* Session type pills */
.session-pills { display: flex; gap: 6px; }

.session-pill {
    font-family: 'Roboto Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 2px;
    border: 1px solid var(--border2);
    color: var(--text-dim);
    background: var(--surface3);
    text-transform: uppercase;
}

.session-pill.active {
    border-color: rgba(225,6,0,0.4);
    color: var(--red);
    background: rgba(225,6,0,0.08);
}

/* TABLE */
.timing-wrap { padding: 12px 0 80px; }

.col-headers {
    display: grid;
    grid-template-columns: 32px 36px 80px 1fr 70px 70px;
    gap: 0;
    padding: 8px 12px;
    border-bottom: 2px solid var(--red);
    position: sticky;
    top: calc(3px + 88px);
    background: var(--surface2);
    z-index: 40;
}

.col-h {
    font-family: 'Roboto Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
}

/* Driver Row */
.driver-block { border-bottom: 1px solid var(--border); }

.driver-row {
    display: grid;
    grid-template-columns: 32px 36px 80px 1fr 70px 70px;
    gap: 0;
    padding: 10px 12px;
    align-items: center;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
}

.driver-row:hover { background: var(--surface3); }
.driver-row.expanded { background: var(--surface3); }

/* Position indicator */
.pos-cell {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Roboto Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
}

.pos-arrow { font-size: 8px; color: var(--text-dim); }
.pos-arrow.up { color: var(--green); }
.pos-arrow.down { color: var(--red); }

/* Team color bar */
.team-bar {
    width: 3px;
    height: 28px;
    border-radius: 1px;
    flex-shrink: 0;
}

/* Driver name */
.drv-cell {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

/* Tyre */
.tyre-cell {
    display: flex; align-items: center; gap: 5px;
}

.tyre-dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid currentColor;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Roboto Mono', monospace;
    font-size: 9px;
    font-weight: 700;
}

.tyre-age {
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
}

/* Lap time */
.time-cell {
    font-family: 'Roboto Mono', monospace;
    font-size: 13px;
    font-weight: 700;
}
.time-cell.purple { color: var(--purple); }
.time-cell.green { color: var(--green); }
.time-cell.yellow { color: var(--yellow); }
.time-cell.white { color: var(--text); }

/* Gap */
.gap-cell {
    font-family: 'Roboto Mono', monospace;
    font-size: 11px;
    color: var(--text-mid);
}

/* Stops */
.stops-cell {
    font-family: 'Roboto Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    text-align: center;
}

/* Expanded row */
.driver-details {
    display: none;
    padding: 8px 12px 12px 80px;
    background: var(--surface3);
    border-bottom: 1px solid var(--border);
}

.driver-details.open { display: flex; gap: 24px; }

.detail-seg { display: flex; flex-direction: column; gap: 2px; }

.detail-seg-label {
    font-family: 'Roboto Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
}

.detail-seg-time {
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
}
.detail-seg-time.purple { color: var(--purple); }
.detail-seg-time.green { color: var(--green); }

/* STATUS BAR */
#status-bar {
    position: fixed; bottom: 0;
    background: var(--surface2);
    left: 0; right: 0;
    border-top: 1px solid var(--border2);
    padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 1000;
}

.status-left { display: flex; align-items: center; gap: 12px; }

.status-dot-wrap {
    display: flex; align-items: center; gap: 5px;
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
}

.s-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease-in-out infinite;
}
.s-dot.red { background: var(--red); }
.s-dot.yellow { background: var(--yellow); }

#ws-status {
    font-family: 'Roboto Mono', monospace;
    font-size: 10px; color: var(--text-dim);
}

.back-btn {
    display: flex; align-items: center; gap: 5px;
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-decoration: none;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 3px;
}

/* Connecting overlay */
#connecting-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 500;
    flex-direction: column; gap: 16px;
}

.conn-spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border2);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.conn-text {
    font-family: 'Roboto Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
}

/* P1 highlight row */
.driver-block:first-child .driver-row { background: rgba(225,6,0,0.04); }

</style>
</head>
<body>

<div class="top-bar"></div>

<div id="connecting-overlay">
    <div style="font-family: 'Roboto Mono', monospace; font-size:9px;letter-spacing:3px;color:var(--red);text-transform:uppercase;margin-bottom:8px;">Brown GP</div>
    <div class="conn-spinner"></div>
    <div class="conn-text" id="conn-text">Connecting to live timing...</div>
</div>

<div class="page-header">
    <div class="header-top">
        <div class="header-left">
            <div class="session-eyebrow">Live Session</div>
            <div id="session-name"></div>
        </div>
        <div class="header-right">
            <div class="live-badge"><div class="live-dot"></div>LIVE</div>
            <div id="session-clock">--:--</div>
        </div>
    </div>
    <div class="session-pills" id="session-pills"></div>
</div>

<div class="timing-wrap">
    <div class="col-headers">
        <div class="col-h">Pos</div>
        <div class="col-h"></div>
        <div class="col-h">Driver</div>
        <div class="col-h">Tyre</div>
        <div class="col-h">Lap Time</div>
        <div class="col-h">Gap</div>
        <div class="col-h">Pits</div>
    </div>
    <div id="timing-table"></div>
</div>

<div id="status-bar">
    <div class="status-left">
        <div class="status-dot-wrap"><div class="s-dot" id="ws-dot"></div><span id="ws-status">Connecting</span></div>
    </div>
    <a href="/" class="back-btn">Home</a>
</div>

<script>
// DATA
let LIVE_DATA = { SessionInfo: {}, TimingData: {}, TimingAppData: {}, DriverList: {}, RaceControlMessages: { Messages: [] } };
let expandedDrivers = new Set();
let ws;

// WEBSOCKET
const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';

function connectWS() {
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => {
        document.getElementById('ws-dot').className = 's-dot';
        document.getElementById('ws-status').innerText = 'Live';
    };
    ws.onclose = () => {
        document.getElementById('ws-dot').className = 's-dot red';
        document.getElementById('ws-status').innerText = 'Disconnected';
        setTimeout(connectWS, 3000);
    };
    ws.onmessage = e => {
        try {
            const msg = JSON.parse(e.data);
            if (msg.SessionInfo) LIVE_DATA.SessionInfo = { ...LIVE_DATA.SessionInfo, ...msg.SessionInfo };
            if (msg.TimingData) mergeDeep(LIVE_DATA.TimingData, msg.TimingData);
            if (msg.TimingAppData) mergeDeep(LIVE_DATA.TimingAppData, msg.TimingAppData);
            if (msg.DriverList) mergeDeep(LIVE_DATA.DriverList, msg.DriverList);
            render();
        } catch (err) {}
    };
}

function mergeDeep(target, source) {
    if (!source || typeof source !== 'object') return;
    Object.keys(source).forEach(k => {
        if (source[k] && typeof source[k] === 'object' && !Array.isArray(source[k])) {
            if (!target[k]) target[k] = {};
            mergeDeep(target[k], source[k]);
        } else {
            target[k] = source[k];
        }
    });
}

// FETCH INITIAL
async function fetchInitial() {
    try {
        const [session, timing, timingApp, drivers] = await Promise.all([
            fetch('/api/session').then(r => r.json()),
            fetch('/api/timing').then(r => r.json()),
            fetch('/api/timingapp').then(r => r.json()),
            fetch('/api/drivers').then(r => r.json())
        ]);
        LIVE_DATA.SessionInfo = session;
        LIVE_DATA.TimingData = timing;
        LIVE_DATA.TimingAppData = timingApp;
        LIVE_DATA.DriverList = drivers;
        document.getElementById('connecting-overlay').style.display = 'none';
        render();
        connectWS();
    } catch (e) {
        document.getElementById('conn-text').innerText = 'Failed to connect. Retrying...';
        setTimeout(fetchInitial, 3000);
    }
}

// RENDER
function render() {
    renderHeader();
    renderTable();
}

function renderHeader() {
    const si = LIVE_DATA.SessionInfo;
    if (!si || !si.Meeting) return;
    const meetingName = si.Meeting?.Name || '';
    const sessionName = si.Name || '';
    document.getElementById('session-name').innerText = `${meetingName} ${sessionName}`;
    
    // Clock
    const remaining = si.SessionTimeToSession || si.TimeOfDay;
    if (remaining) {
        document.getElementById('session-clock').innerText = remaining;
    }
}

function renderTable() {
    const td = LIVE_DATA.TimingData;
    const tad = LIVE_DATA.TimingAppData;
    const dl = LIVE_DATA.DriverList;

    if (!td || !td.Lines) return;
    const lines = td.Lines;

    const drivers = Object.entries(lines)
        .map(([num, data]) => ({ num, data, driverInfo: dl[num] || {} }))
        .sort((a, b) => {
            const pa = parseInt(a.data.Position) || 99;
            const pb = parseInt(b.data.Position) || 99;
            return pa - pb;
        });

    const table = document.getElementById('timing-table');
    const isQual = (LIVE_DATA.SessionInfo?.Name || '').toLowerCase().includes('qual');

    drivers.forEach((drv, idx) => {
        const drvInfo = drv.driverInfo;
        const pos = drv.data.Position || (idx + 1);
        const name = drvInfo.Tla || drvInfo.Abbreviation || drv.num;
        const teamColor = '#' + (drvInfo.TeamColour || drvInfo.TeamColor || 'ffffff').replace('#','');

        // Tyre from TimingAppData
        const tyreData = tad?.Lines?.[drv.num]?.Stints;
        let compound = '?', tyreAge = 0, stops = 0;
        
        if (tyreData) {
            const stints = Object.values(tyreData);
            if (stints.length > 0) {
                const last = stints[stints.length - 1];
                compound = (last.Compound || '?')[0];
                tyreAge = last.TotalLaps || 0;
                stops = stints.length - 1;
            }
        }

        const tyreColor = compound === 'H' ? '#ffffff' :
                          compound === 'M' ? '#ffe600' :
                          compound === 'S' ? '#ff2a2a' :
                          compound === 'I' ? '#00e640' :
                          compound === 'W' ? '#0088ff' : '#888';

        // Lap time
        const bestLap = drv.data.BestLapTime?.Value || drv.data.LastLapTime?.Value || '-';
        const lapClass = drv.data.BestLapTime?.OverallFastest ? 'purple' :
                         drv.data.BestLapTime?.PersonalFastest ? 'green' : 'white';

        const gap = pos == 1 ? 'Leader' : (drv.data.GapToLeader || drv.data.TimeDiffToPositionAhead || '-');

        const existingBlock = document.getElementById(`drv-${drv.num}`);
        
        if (existingBlock) {
            // Update existing
            existingBlock.querySelector('.pos-num').innerText = pos;
            existingBlock.querySelector('.time-cell').innerText = bestLap;
            existingBlock.querySelector('.time-cell').className = `time-cell ${lapClass}`;
            existingBlock.querySelector('.gap-cell').innerText = gap;
            existingBlock.querySelector('.stops-cell').innerText = stops;
            existingBlock.querySelector('.tyre-age').innerText = tyreAge;
        } else {
            const block = document.createElement('div');
            block.className = 'driver-block';
            block.id = `drv-${drv.num}`;
            const isExpanded = expandedDrivers.has(drv.num);
            
            block.innerHTML = `
                <div class="driver-row ${isExpanded ? 'expanded' : ''}" onclick="toggleDriver('${drv.num}')">
                    <div class="pos-cell"><span class="pos-num">${pos}</span></div>
                    <div style="display: flex; align-items: center;">
                        <div class="team-bar" style="background:${teamColor};"></div>
                    </div>
                    <div class="drv-cell">${name}</div>
                    <div class="tyre-cell">
                        <div class="tyre-dot" style="color:${tyreColor}; border-color:${tyreColor};">${compound}</div>
                        <span class="tyre-age">${tyreAge}</span>
                    </div>
                    <div class="time-cell ${lapClass}">${bestLap}</div>
                    <div class="gap-cell">${gap}</div>
                    <div class="stops-cell">${stops}</div>
                </div>
                <div class="driver-details ${isExpanded ? 'open' : ''}" id="detail-${drv.num}">
                    ${buildDetail(drv, isQual)}
                </div>`;
            table.appendChild(block);
        }
    });
}

function buildDetail(drv, isQual) {
    if (isQual) {
        const q = drv.data.BestLapTimes || [];
        return ['01','02','03'].map(seg => {
            const val = q[seg]?.Value || '';
            return `<div class="detail-seg">
                        <div class="detail-seg-label">${seg}</div>
                        <div class="detail-seg-time">${val}</div>
                    </div>`;
        }).join('');
    } else {
        const s = drv.data.Sectors || {};
        return [0,1,2].map(i => {
            const sec = s[i] || {};
            const val = sec.Value || sec.PreviousValue || '';
            const cls = sec.OverallFastest ? 'purple' : sec.PersonalFastest ? 'green' : '';
            return `<div class="detail-seg">
                        <div class="detail-seg-label">S${i+1}</div>
                        <div class="detail-seg-time ${cls}">${val}</div>
                    </div>`;
        }).join('');
    }
}

function toggleDriver(num) {
    if (expandedDrivers.has(num)) {
        expandedDrivers.delete(num);
        document.getElementById(`detail-${num}`)?.classList.remove('open');
        document.querySelector(`#drv-${num} .driver-row`)?.classList.remove('expanded');
    } else {
        expandedDrivers.add(num);
        document.getElementById(`detail-${num}`)?.classList.add('open');
        document.querySelector(`#drv-${num} .driver-row`)?.classList.add('expanded');
    }
}

// CLOCK
setInterval(() => {
    const el = document.getElementById('session-clock');
    if (el && el.innerText !== '--:--' && !el.innerText.includes(':')) return;
}, 1000);

fetchInitial();
</script>
</body>
</html>
