<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Brown GP — Season Dashboard</title>
  <link rel="icon" href="/assets/bgp-favicon.png" type="image/png">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#000}
    #dashboard{position:fixed;inset:0;width:100%;height:100%;border:0;background:#08090b;opacity:0;transition:opacity .8s ease}
    #dashboard.visible{opacity:1}
    #intro{position:fixed;inset:0;z-index:2;background:#000;overflow:hidden}
    #car{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease}
    #car.visible{opacity:1}
    #car.dissolve{opacity:0}
    #brand{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .85s ease}
    #brand.visible{opacity:1}
    #brand img{width:min(78vw,440px);height:auto;filter:drop-shadow(0 5px 22px rgba(0,0,0,.5))}
    #fallback{position:absolute;left:16px;right:16px;bottom:32px;text-align:center;display:none;color:#fff;font:14px/1.6 system-ui,sans-serif}
    #fallback a{color:#fff}
    @media(prefers-reduced-motion:reduce){#car,#brand,#dashboard{transition-duration:.15s}}
  </style>
</head>
<body>
  <!-- The unchanged Season Dashboard loads in parallel; the browser URL stays here. -->
  <iframe id="dashboard" src="/season" title="Brown GP Season Dashboard"></iframe>
  <div id="intro" aria-label="Brown GP opening sequence">
    <picture>
      <source media="(orientation:landscape)" srcset="/landing-002/car-landscape">
      <img id="car" src="/landing-002/car-portrait" alt="Brown GP Formula racing car">
    </picture>
    <div id="brand"><img src="/assets/browngp-logo.png" alt="Brown GP"></div>
    <div id="fallback">Season Dashboard is taking longer than expected. <a href="/season">Open it directly</a>.</div>
  </div>
  <script>
    (function(){
      'use strict';
      const car=document.getElementById('car');
      const brand=document.getElementById('brand');
      const intro=document.getElementById('intro');
      const dashboard=document.getElementById('dashboard');
      const fallback=document.getElementById('fallback');
      const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      let dashboardReady=false,sequenceDone=false,revealed=false;
      function checkDashboard(){
        if(revealed||dashboardReady)return;
        try{
          const doc=dashboard.contentDocument;
          if(doc){
            const main=doc.getElementById('seasonMain');
            if(main&&!main.hidden){dashboardReady=true;reveal();return;}
          }
        }catch(e){}
        setTimeout(checkDashboard,200);
      }
      function reveal(){
        if(!dashboardReady||!sequenceDone||revealed)return;
        revealed=true;
        dashboard.classList.add('visible');
        setTimeout(()=>intro.remove(),850);
      }
      async function showIntro(){
        try{
          if(!car.complete)await Promise.race([
            new Promise(resolve=>{car.addEventListener('load',resolve,{once:true});car.addEventListener('error',resolve,{once:true});}),
            wait(10000)
          ]);
          if(car.naturalWidth)car.classList.add('visible');
          await wait(1600);
          car.classList.add('dissolve');
          await wait(1200);
          brand.classList.add('visible');
          await wait(1300);
          brand.classList.remove('visible');
          await wait(900);
        }finally{
          sequenceDone=true;
          reveal();
        }
      }
      setTimeout(()=>{if(!dashboardReady)fallback.style.display='block';},16000);
      checkDashboard();
      showIntro();
    })();
  </script>
</body>
</html>
