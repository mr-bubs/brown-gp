<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>Brown GP — Season</title>
  <link rel="icon" href="/assets/bgp-favicon.png" type="image/png">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#08090b;overflow:hidden}
    #dashboard{position:absolute;inset:0;width:100%;height:100%;border:0;background:#08090b}
    #loader{position:fixed;inset:0;z-index:10;background:#08090b;color:white;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:opacity .65s ease,visibility .65s ease}
    #loader.done{opacity:0;visibility:hidden;pointer-events:none}
    #frames{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
    #loader::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.08) 15%,rgba(0,0,0,.62) 100%);pointer-events:none}
    .center{position:relative;z-index:1;display:flex;align-items:center;flex-direction:column;gap:20px;padding:24px;text-align:center}
    .logo{display:block;width:min(78vw,380px);height:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6))}
    .label{font:600 12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.28em;color:#e4e4e4;text-shadow:0 2px 10px #000;animation:pulse 1.5s ease-in-out infinite}
    .error{display:none;max-width:320px;font:14px/1.5 system-ui,sans-serif;color:#e6e6e6}
    .error a{color:#fff;text-decoration:underline}
    #loader.failed .error{display:block}
    #loader.failed .label{display:none}
    @keyframes pulse{50%{opacity:.45}}
    @media(max-width:767px){#frames{display:block}}
    @media(prefers-reduced-motion:reduce){.label{animation:none}#loader{transition:none}}
  </style>
</head>
<body>
  <!-- Loading the existing dashboard in parallel preserves its current API and error handling. -->
  <iframe id="dashboard" src="/season" title="Brown GP Season Dashboard"></iframe>
  <div id="loader" role="status" aria-live="polite">
    <img id="frames" alt="" aria-hidden="true">
    <div class="center">
      <img class="logo" src="/assets/browngp-logo.png" alt="Brown GP">
      <div class="label">LOADING DATA</div>
      <div class="error">Season data could not be loaded. <a href="/season">Open Season Dashboard</a> or try again later.</div>
    </div>
  </div>
  <script>
    (function(){
      'use strict';
      const loader=document.getElementById('loader');
      const dashboard=document.getElementById('dashboard');
      const frameEl=document.getElementById('frames');
      const mobile=window.matchMedia('(max-width:767px)').matches;
      const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let finished=false;
      let frameIndex=0;
      let current=null;
      let next=null;
      let lastAdvance=performance.now();
      const frameUrl=i=>'/F1_Webp_LANDING002/frame_'+String(i).padStart(3,'0')+'_delay-0.2s.webp';
      function preload(i){
        if(i>100)return null;
        const im=new Image();
        im.src=frameUrl(i);
        return im;
      }
      function animate(now){
        if(finished||!mobile||reduceMotion)return;
        if(current&&current.complete&&current.naturalWidth){
          if(frameEl.src!==current.src)frameEl.src=current.src;
          if(now-lastAdvance>=62.5&&frameIndex<100){
            if(next&&next.complete&&next.naturalWidth){
              frameIndex++;
              current=next;
              next=preload(frameIndex+1);
              lastAdvance=now;
            }
          }
        }
        requestAnimationFrame(animate);
      }
      if(mobile&&!reduceMotion){
        current=preload(0);
        next=preload(1);
        requestAnimationFrame(animate);
      }
      function checkDashboard(){
        if(finished)return;
        try{
          const doc=dashboard.contentDocument;
          if(!doc)return;
          const main=doc.getElementById('seasonMain');
          const loading=doc.getElementById('seasonLoading');
          if(main&&!main.hidden){
            finished=true;
            loader.classList.add('done');
            setTimeout(()=>loader.remove(),700);
            return;
          }
          if(loading&&loading.textContent.includes('Current season data could not be loaded')){
            finished=true;
            loader.classList.add('failed');
            return;
          }
        }catch(e){/* Keep waiting for same-origin dashboard. */}
        setTimeout(checkDashboard,150);
      }
      dashboard.addEventListener('error',()=>{
        finished=true;
        loader.classList.add('failed');
      });
      checkDashboard();
    })();
  </script>
</body>
</html>
