<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>Brown GP — Season</title>
  <link rel="icon" href="/assets/bgp-favicon.png" type="image/png">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#08090b;overflow:hidden}
    #dashboard{position:absolute;inset:0;width:100%;height:100%;border:0;background:#08090b}
    #loader{position:fixed;inset:0;z-index:10;background:#08090b;color:white;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:opacity .65s ease,visibility .65s ease}
    #loader.done{opacity:0;visibility:hidden;pointer-events:none}
    #frames{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
    #loader::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.08) 15%,rgba(0,0,0,.62) 100%);pointer-events:none}
    .center{position:relative;z-index:1;display:flex;align-items:center;flex-direction:column;gap:20px;padding:24px;text-align:center}
    .logo{display:block;width:min(78vw,380px);height:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6))}
    .label{font:600 12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.28em;color:#e4e4e4;text-shadow:0 2px 10px #000;animation:pulse 1.5s ease-in-out infinite}
    .error{display:none;max-width:320px;font:14px/1.5 system-ui,sans-serif;color:#e6e6e6}
    .error a{color:#fff;text-decoration:underline}
    #loader.failed .error{display:block}
    #loader.failed .label{display:none}
    @keyframes pulse{50%{opacity:.45}}
    @media(max-width:767px){#frames{display:block}}
    @media(prefers-reduced-motion:reduce){.label{animation:none}#loader{transition:none}}
  </style>
</head>
<body>
  <!-- Loading the existing dashboard in parallel preserves its current API and error handling. -->
  <iframe id="dashboard" src="/season" title="Brown GP Season Dashboard"></iframe>
  <div id="loader" role="status" aria-live="polite">
    <img id="frames" alt="" aria-hidden="true">
    <div class="center">
      <img class="logo" src="/assets/browngp-logo.png" alt="Brown GP">
      <div class="label">LOADING DATA</div>
      <div class="error">Season data could not be loaded. <a href="/season">Open Season Dashboard</a> or try again later.</div>
    </div>
  </div>
  <script>
    (function(){
      'use strict';
      const loader=document.getElementById('loader');
      const dashboard=document.getElementById('dashboard');
      const frameEl=document.getElementById('frames');
      const mobile=matchMedia('(max-width:767px)').matches;
      const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
      const frameUrl=i=>'/F1_Webp_LANDING002/frame_'+String(i).padStart(3,'0')+'_delay-0.2s.webp';
      const COUNT=101, FPS=16, FAST_MBPS=180, MAX_PRELOAD_MS=12000;
      const blobs=new Array(COUNT), urls=new Array(COUNT);
      const controller=new AbortController();
      let dashboardReady=false, dashboardFailed=false, decisionMade=false, cinematic=false, cinematicDone=false, dismissed=false;
      let lastFrame=0, started=0;
      const began=performance.now();
      const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      function release(){
        controller.abort();
        for(let i=0;i<COUNT;i++){if(urls[i]){URL.revokeObjectURL(urls[i]);urls[i]=null;}blobs[i]=null;}
      }
      function dismiss(){
        if(dismissed)return;
        dismissed=true;
        loader.classList.add('done');
        setTimeout(()=>{frameEl.removeAttribute('src');release();loader.remove();},700);
      }
      function revealIfReady(){
        if(dashboardFailed){loader.classList.add('failed');return;}
        if(dashboardReady&&decisionMade&&(!cinematic||cinematicDone))dismiss();
      }
      function checkDashboard(){
        if(dismissed||dashboardReady||dashboardFailed)return;
        try{
          const doc=dashboard.contentDocument;
          if(doc){
            const main=doc.getElementById('seasonMain');
            const loading=doc.getElementById('seasonLoading');
            if(main&&!main.hidden){dashboardReady=true;revealIfReady();return;}
            if(loading&&loading.textContent.includes('Current season data could not be loaded')){
              dashboardFailed=true;decisionMade=true;release();revealIfReady();return;
            }
          }
        }catch(e){}
        setTimeout(checkDashboard,150);
      }
      dashboard.addEventListener('error',()=>{dashboardFailed=true;decisionMade=true;release();revealIfReady();});
      checkDashboard();
      async function download(i){
        const response=await fetch(frameUrl(i),{signal:controller.signal,cache:'force-cache'});
        if(!response.ok)throw new Error('Frame '+i+' HTTP '+response.status);
        const blob=await response.blob();
        blobs[i]=blob;
        return blob.size;
      }
      function show(i){
        if(!urls[i])urls[i]=URL.createObjectURL(blobs[i]);
        frameEl.src=urls[i];
      }
      async function play(){
        cinematic=true;
        decisionMade=true;
        revealIfReady();
        started=performance.now();
        function tick(now){
          if(dismissed||dashboardFailed)return;
          const index=Math.min(COUNT-1,Math.floor((now-started)*FPS/1000));
          if(index!==lastFrame){lastFrame=index;show(index);}
          if(index===COUNT-1&&now-started>=COUNT*1000/FPS){
            cinematicDone=true;
            revealIfReady();
            return;
          }
          requestAnimationFrame(tick);
        }
        show(0);
        requestAnimationFrame(tick);
      }
      async function run(){
        if(!mobile||reduceMotion){decisionMade=true;revealIfReady();return;}
        try{
          // First frames are the connection probe, not an unrelated speed-test download.
          const sampleStart=performance.now();
          let sampleBytes=0;
          for(let i=0;i<3;i++){
            sampleBytes+=await download(i);
            if(i===0)show(0);
            if(performance.now()-began>4000)break;
          }
          const elapsed=(performance.now()-sampleStart)/1000;
          const mbps=sampleBytes*8/Math.max(elapsed,.001)/1e6;
          if(mbps<FAST_MBPS||blobs.slice(0,3).some(x=>!x)){
            decisionMade=true;revealIfReady();return;
          }
          // A fast link gets a complete cinematic, provided the buffer finishes
          // within a strict time budget. Never block a slower or unstable visitor.
          let cursor=3, failed=false;
          const worker=async()=>{
            while(!failed&&!dashboardFailed&&performance.now()-began<MAX_PRELOAD_MS){
              const i=cursor++;
              if(i>=COUNT)return;
              try{await download(i);}catch(e){failed=true;return;}
            }
          };
          await Promise.all(Array.from({length:8},worker));
          if(failed||dashboardFailed||decisionMade||dismissed||blobs.some(x=>!x)){
            decisionMade=true;revealIfReady();return;
          }
          await play();
        }catch(e){
          decisionMade=true;revealIfReady();
        }
      }
      // Even if a network request hangs, the loader will not hold ready data indefinitely.
      setTimeout(()=>{if(!decisionMade){decisionMade=true;controller.abort();revealIfReady();}},MAX_PRELOAD_MS+1000);
      run();
    })();
  </script>
</body>
</html>
