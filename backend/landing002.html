<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>Brown GP — Season</title>
  <link rel="icon" href="/assets/bgp-favicon.png" type="image/png">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#08090b;overflow:hidden}
    #dashboard{position:absolute;inset:0;width:100%;height:100%;border:0;background:#08090b}
    #loader{position:fixed;inset:0;z-index:10;background:#08090b;color:white;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:opacity .65s ease,visibility .65s ease}
    #loader.done{opacity:0;visibility:hidden;pointer-events:none}
    #frames{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
    #loader::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.08) 15%,rgba(0,0,0,.62) 100%);pointer-events:none}
    .center{position:absolute;top:max(26px,env(safe-area-inset-top));left:0;right:0;z-index:2;display:flex;align-items:center;flex-direction:column;gap:10px;padding:16px;text-align:center}
    .logo{display:block;width:min(65vw,300px);height:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6))}
    .label{font:600 12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.28em;color:#e4e4e4;text-shadow:0 2px 10px #000;animation:pulse 1.5s ease-in-out infinite}
    .error{display:none;max-width:320px;font:14px/1.5 system-ui,sans-serif;color:#e6e6e6}
    .error a{color:#fff;text-decoration:underline}
    #loader.failed .error{display:block}
    #loader.failed .label{display:none}
    @keyframes pulse{50%{opacity:.45}}
    .center > a:first-child{display:block;line-height:0}
    .dashboard-link{margin-top:-48px;position:relative;z-index:3;color:#fff;text-decoration:none;font:600 12px/1.5 ui-monospace,monospace;letter-spacing:.18em;text-shadow:0 2px 10px #000;padding:8px 12px}
    .dashboard-link:focus-visible{outline:2px solid #fff;outline-offset:4px}
    #scrollHint{position:fixed;bottom:max(38px,env(safe-area-inset-bottom));left:0;right:0;z-index:2;text-align:center;color:white;font:600 12px/1.7 ui-monospace,monospace;letter-spacing:.2em;text-shadow:0 2px 12px #000;display:none;pointer-events:none}
    #scrollHint.visible{display:block}
    #loader{touch-action:none}
    @media(prefers-reduced-motion:reduce){.label{animation:none}#loader{transition:none}}
  </style>
</head>
<body>
  <!-- Keep the existing dashboard intact; navigation is explicit only. -->
  <iframe id="dashboard" src="/season" title="Brown GP Season Dashboard" tabindex="-1"></iframe>
  <div id="loader">
    <img id="frames" alt="Brown GP cinematic explosion frame">
    <div class="center">
      <a href="/season" aria-label="Go to Brown GP Dashboard"><img class="logo" src="/assets/browngp-logo.png" alt="Brown GP"></a>
      <a class="dashboard-link" href="/season">GO TO DASHBOARD</a>
      <div class="label" id="loadingLabel">LOADING 0%</div>
    </div>
    <div id="scrollHint" aria-live="polite">SCROLL TO EXPLODE<br>↓</div>
  </div>
  <script>
    (function(){
      'use strict';
      const COUNT=101;
      const frameEl=document.getElementById('frames');
      const label=document.getElementById('loadingLabel');
      const hint=document.getElementById('scrollHint');
      const loader=document.getElementById('loader');
      const frameUrl=i=>'/F1_Webp_LANDING002/frame_'+String(i).padStart(3,'0')+'_delay-0.2s.webp';
      const frames=new Array(COUNT);
      let index=0,ready=false,touchY=null,scrollAccumulator=0;
      function show(i){
        if(!ready)return;
        index=Math.max(0,Math.min(COUNT-1,i));
        frameEl.src=frames[index].src;
      }
      function load(i){
        return new Promise((resolve,reject)=>{
          const image=new Image();
          image.onload=()=>resolve(image);
          image.onerror=()=>reject(new Error('Frame '+i+' failed to load'));
          image.src=frameUrl(i);
        });
      }
      async function prepare(){
        try{
          // Show frame zero as soon as it is available, then retain it in view.
          for(let i=0;i<COUNT;i++){
            frames[i]=await load(i);
            if(i===0)frameEl.src=frames[0].src;
            label.textContent='LOADING '+Math.round((i+1)*100/COUNT)+'%';
          }
          ready=true;
          label.style.display='none';
          hint.classList.add('visible');
        }catch(error){
          console.error('LANDING-002 image preload:',error);
          label.textContent='ANIMATION UNAVAILABLE';
          hint.textContent='SCROLL UNAVAILABLE';
          hint.classList.add('visible');
        }
      }
      function advance(delta){
        if(!ready)return;
        scrollAccumulator+=delta;
        const steps=Math.trunc(scrollAccumulator/14);
        if(steps){
          scrollAccumulator-=steps*14;
          show(index+steps);
        }
      }
      loader.addEventListener('wheel',event=>{
        if(!ready)return;
        event.preventDefault();
        advance(event.deltaY);
      },{passive:false});
      loader.addEventListener('touchstart',event=>{
        if(event.touches.length===1)touchY=event.touches[0].clientY;
      },{passive:true});
      loader.addEventListener('touchmove',event=>{
        if(touchY===null||!ready)return;
        const y=event.touches[0].clientY;
        advance((touchY-y)*2);
        touchY=y;
        event.preventDefault();
      },{passive:false});
      loader.addEventListener('touchend',()=>{touchY=null;});
      loader.addEventListener('touchcancel',()=>{touchY=null;});
      prepare();
    })();
  </script>
</body>
</html>
